[project]
name = "desk-companion"
version = "0.3.0"
description = "tebb 个人 Agent 工作台：对话、记忆、任务与协作"
requires-python = ">=3.11"
dependencies = [
    "httpx[socks]>=0.27,<1",
    "pypdf>=5.0",
    "psutil>=7.0,<8",
    "pillow>=10.0",
    "matplotlib>=3.9,<4",
    "jsonschema>=4,<5",
    "python-dotenv>=1.0",
    "pywin32>=306",
    "pywebview>=5.0",
    "pystray>=0.19",
    "huggingface_hub>=0.23",
    "sentence-transformers>=3.0",
    "transformers>=5,<6",
    "jinja2>=3.1,<4",
    "yt-dlp==2026.8.19",
    "yt-dlp-ejs==0.8.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["desk_companion*"]

[tool.setuptools.package-data]
desk_companion = ["ui/*"]
