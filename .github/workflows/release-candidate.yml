name: Release candidate
on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Complete 40-character main commit SHA with successful CI'
        required: true
        type: string
      upload_draft:
        description: 'Explicitly authorize upload to a NEW draft Release (never publish)'
        default: false
        type: boolean
permissions:
  contents: read
  actions: read
concurrency:
  group: release-candidate-${{ inputs.sha }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      PYTHONUTF8: '1'
      DESK_RELEASE: '1'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.16'
      - name: Require complete SHA and successful CI before executing candidate code
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.sha }}
        shell: pwsh
        run: |
          python scripts/ci_checks.py gate $env:CANDIDATE_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git checkout --detach $env:CANDIDATE_SHA
          exit $LASTEXITCODE
      - name: Read pinned Atlas ref
        id: atlas
        shell: pwsh
        run: |
          $atlasRef = python scripts/ci_checks.py atlas-ref
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "sha=$atlasRef" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: liukun158959-beep/Atlas
          ref: ${{ steps.atlas.outputs.sha }}
          path: .ci-atlas
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm install --global pnpm@12.5.1
      - run: pnpm install --frozen-lockfile
        working-directory: client
      - run: python -m pip install -r scripts/runtime-lock.txt
      - name: Validate and prepare isolated runtime
        shell: pwsh
        run: |
          python scripts/ci_checks.py version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/prepare_runtime.py --atlas .ci-atlas --output "$env:RUNNER_TEMP/tebb-runtime"
          exit $LASTEXITCODE
      - run: pnpm tauri build --no-bundle
        working-directory: client
      - name: Runtime, archive and relocation checks
        shell: pwsh
        run: |
          python scripts/smoke_release.py "$env:RUNNER_TEMP/tebb-runtime"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/bundle_release.py --runtime-package "$env:RUNNER_TEMP/tebb-runtime" --output .ci-output/distribution
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archive = Get-ChildItem .ci-output/distribution/tebb-*-windows-x64.zip
          if (@($archive).Count -ne 1) { throw 'Expected exactly one archive' }
          python scripts/ci_checks.py smoke-zip $archive.FullName "$env:RUNNER_TEMP/中文路径 with spaces"
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate-${{ inputs.sha }}
          path: .ci-output/distribution/
          if-no-files-found: error
          retention-days: 14
  draft:
    if: inputs.upload_draft
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-candidate-${{ inputs.sha }}
          path: .ci-output/distribution
      - name: Upload a new draft only; never overwrite a tag or existing release
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.sha }}
        run: python scripts/draft_release.py .ci-output/distribution
