name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      diagnostics:
        description: 'Run local SSE performance diagnostics (not task-quality eval or paid model calls)'
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm install --global pnpm@12.5.1
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('client/pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
        working-directory: client
      - run: pnpm test
        working-directory: client
      - run: pnpm exec tsc --noEmit
        working-directory: client
      - run: pnpm build
        working-directory: client
        env:
          DESK_RELEASE: '1'

  python:
    name: Python / Atlas
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.16'
          cache: pip
          cache-dependency-path: scripts/runtime-lock.txt
      - name: Read pinned Atlas ref
        id: atlas
        shell: pwsh
        run: |
          $atlasRef = python scripts/ci_checks.py atlas-ref
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "sha=$atlasRef" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: liukun158959-beep/Atlas
          ref: ${{ steps.atlas.outputs.sha }}
          path: .ci-atlas
          persist-credentials: false
      - run: python -m pip install -r scripts/runtime-lock.txt
      - name: Versions and complete regression (one attempt)
        shell: pwsh
        run: |
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE '.ci-atlas'
          $env:DESK_TEST_ATLAS_SOURCE = $env:PYTHONPATH
          $env:DESK_COMPANION_DATA_DIR = Join-Path $env:RUNNER_TEMP 'tebb-ci-profile'
          python scripts/ci_checks.py version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ci_checks.py test --output .ci-output
          exit $LASTEXITCODE
      - name: Optional local SSE diagnostic hook
        if: github.event_name == 'workflow_dispatch' && inputs.diagnostics
        shell: pwsh
        run: |
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE '.ci-atlas'
          python scripts/benchmark_agent.py --samples 20 --parallel 1 --prewarm --think-time 2 --output .ci-output/local-sse-diagnostics.json
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: python-results-${{ github.sha }}
          path: .ci-output/
          if-no-files-found: warn
          retention-days: 14

  rust:
    name: Rust
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            client/src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('client/src-tauri/Cargo.lock') }}
      - run: cargo test --locked
        working-directory: client/src-tauri
